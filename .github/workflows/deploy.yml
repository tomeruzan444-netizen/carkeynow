name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build Static Site & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Copy .htaccess into build output
        run: cp .htaccess out/.htaccess

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp (with correct permissions)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' $FTP_SERVER;
            mirror --reverse --delete --verbose --use-cache \
              --exclude .git/ \
              --exclude node_modules/ \
              ./out/ /public_html/;
            find /public_html -type f -exec chmod 644 {} \;;
            find /public_html -type d -exec chmod 755 {} \;;
          "

      - name: Done
        run: echo "Deploy complete"